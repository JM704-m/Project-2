<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellular Life Support - CMPM 180</title>
  <script src="lib/p5.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #080305;
      color: #eaeaea;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 12px 48px rgba(180, 20, 45, 0.45);
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 75, 95, 0.35);
    }
    .instruction-bar {
      margin-top: 14px;
      font-size: 13.5px;
      color: #9e9e9e;
      text-align: center;
      letter-spacing: 0.6px;
    }
    .key-badge {
      background: #2b1218;
      color: #ff5e78;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #ff4757;
      font-weight: 600;
      font-size: 12px;
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    </div>

  <div class="instruction-bar">
    CONTROLS: <span class="key-badge">W</span> <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> Move | 
    <span class="key-badge">E</span> Pick Bubble (Max 2) | Deliver to Destination (+100 pts each)
  </div>

  <script src="sketch.js"></script>
</body>
</html>
